[project]
name = "payroll-service-agent"
version = "0.1.0"
description = "A minimal LangGraph-based payroll service agent"
authors = [
    {name = "AI Team", email = "ai-team@example.com"}
]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=1.0.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "colorama>=0.4.6",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.1"
]
dev = [
    "ruff>=0.6.0",
    "pre-commit>=3.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"